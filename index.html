<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/icons/os-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PixelRealm OS</title>
    <style>
      /* Prevent text selection and context menus for OS-like experience */
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
      }

      /* Custom scrollbar styling */
      ::-webkit-scrollbar {
        width: 16px;
        height: 16px;
      }

      ::-webkit-scrollbar-track {
        background: rgb(192, 192, 192);
        border: 1px inset rgb(192, 192, 192);
      }

      ::-webkit-scrollbar-thumb {
        background: rgb(192, 192, 192);
        border: 1px outset rgb(192, 192, 192);
      }

      ::-webkit-scrollbar-corner {
        background: rgb(192, 192, 192);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
